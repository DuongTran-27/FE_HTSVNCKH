# T202 (NFR09): lint + test + build mỗi PR cho frontend.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # cần lịch sử nhánh gốc để lấy danh sách file mới của PR
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci # giữ optional deps: binding rolldown/lightningcss/oxide của vite 8 (không dùng --omit=optional)
      - run: npm run lint
      - run: npm run format:check
      - name: Prettier cho file mới của PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff --name-only --diff-filter=A -z "origin/$BASE_REF...HEAD" -- '*.js' '*.jsx' '*.json' '*.yml' '*.yaml' '*.css' \
            | xargs -0 -r npx prettier --check
      - run: npm test
      - run: npm run build

  # T707b B14: E2E Playwright cần code backend. Đặt biến repo BACKEND_REPOSITORY = <owner>/<repo backend>;
  # repo backend private thì thêm secret BACKEND_REPO_TOKEN (PAT chỉ đọc). Chưa đặt biến thì bỏ qua job.
  e2e:
    needs: lint-test-build
    if: vars.BACKEND_REPOSITORY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # khớp e2e/env.js, chỉ DB dùng một lần – không phải bí mật
          POSTGRES_DB: nckh_test
          TZ: Asia/Ho_Chi_Minh
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nckh_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DB_TEST_DRIVER: external
      NO_COLOR: '1'
      NCKH_BACKEND_DIR: ${{ github.workspace }}/backend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKEND_REPOSITORY }}
          token: ${{ secrets.BACKEND_REPO_TOKEN || github.token }}
          persist-credentials: false
          path: backend
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npx prisma generate && npm run db:test:up # tạo pg_trgm/unaccent ở template1 cho nckh_t309_test
        working-directory: backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-e2e
          path: frontend/e2e/.out/test-results/
          if-no-files-found: ignore
          retention-days: 7
